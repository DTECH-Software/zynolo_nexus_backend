spring.application.name=api-gateway
server.port=8099

# Backend services
auth.service.url=http://localhost:8091
setting.service.url=http://localhost:8092
cheque.service.url=http://localhost:8093
po.service.url=http://localhost:8094
meeting-room-booking.service.url=http://localhost:8095

# JWT (must match auth_service secret)
jwt.secret=ChangeThisSecretToSomethingLongerAndSafer123!
internal.api.token=change-me-in-prod

# JACKSON
spring.jackson.parser.allow-unquoted-field-names=true

# CORS
cors.allowed.origins=http://localhost:3000,http://45.79.125.85
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=*

# Spring Cloud Gateway (MVC) routes
spring.cloud.gateway.server.webmvc.routes[0].id=auth-api
spring.cloud.gateway.server.webmvc.routes[0].uri=${auth.service.url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=auth-sso
spring.cloud.gateway.server.webmvc.routes[1].uri=${auth.service.url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/auth/sso/**

spring.cloud.gateway.server.webmvc.routes[2].id=setting-api
spring.cloud.gateway.server.webmvc.routes[2].uri=${setting.service.url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/setting/**

spring.cloud.gateway.server.webmvc.routes[3].id=cheque-api
spring.cloud.gateway.server.webmvc.routes[3].uri=${cheque.service.url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/cheque/**

spring.cloud.gateway.server.webmvc.routes[4].id=po-api
spring.cloud.gateway.server.webmvc.routes[4].uri=${po.service.url}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/po/**

spring.cloud.gateway.server.webmvc.routes[5].id=meeting-room-booking-api
spring.cloud.gateway.server.webmvc.routes[5].uri=${meeting-room-booking.service.url}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/meeting-room/**
