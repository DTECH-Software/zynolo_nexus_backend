name: Deploy Fleet Dev

on:
  push:
    branches: [ "development" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build contracts
        run: mvn -DskipTests -f zynolo-nexus-contracts/pom.xml clean install

      - name: Build fleet_service
        run: |
          mvn -DskipTests -f fleet_service/pom.xml clean package
          test -s fleet_service/target/fleet_service-0.0.1-SNAPSHOT.jar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} \
            "mkdir -p ${APP_DIR}/fleet_service"

      - name: Upload fleet JAR
        run: |
          rsync -avz -e "ssh -p ${SSH_PORT}" \
            fleet_service/target/fleet_service-0.0.1-SNAPSHOT.jar \
            ${SSH_USER}@${SSH_HOST}:${APP_DIR}/fleet_service/fleet_service.jar

      - name: Verify fleet JAR on server
        run: |
          ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} \
            "test -f ${APP_DIR}/fleet_service/fleet_service.jar && ls -la ${APP_DIR}/fleet_service/fleet_service.jar"

      - name: Restart fleet service
        run: |
          ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} "bash -s" <<'REMOTE'
            set -e

            if ! sudo -n systemctl cat fleet_service >/dev/null 2>&1; then
              echo "fleet_service.service is not installed or sudo requires a password."
              echo "Install deploy/systemd/fleet_service.service and configure passwordless systemctl access for the deploy user."
              exit 1
            fi

            sudo -n systemctl daemon-reload
            sudo -n systemctl restart fleet_service
          REMOTE

      - name: Verify fleet core service
        run: |
          ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} "bash -s" <<'REMOTE'
            set -e
            for attempt in {1..12}; do
              if sudo -n systemctl is-active --quiet fleet_service && \
                 curl --fail --silent --show-error --request POST \
                   http://127.0.0.1:8096/api/v1/fleet/health >/tmp/fleet-health.json; then
                cat /tmp/fleet-health.json
                echo
                echo "fleet_service is active and healthy."
                exit 0
              fi
              echo "Waiting for fleet_service health check (${attempt}/12)..."
              sleep 5
            done

            echo "fleet_service failed its health check."
            sudo -n systemctl status fleet_service --no-pager --full || true
            if ! sudo -n journalctl -u fleet_service -n 100 --no-pager 2>/dev/null; then
              echo "GitHub Actions cannot read the system journal with passwordless sudo."
              echo "Run manually: sudo journalctl -u fleet_service -b -n 200 --no-pager"
            fi
            exit 1
          REMOTE
