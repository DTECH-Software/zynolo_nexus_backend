############################
# APPLICATION
############################
spring.application.name=meeting-room-booking-service
server.port=8095

############################
# DATASOURCE - DEV / LOCAL
############################
spring.datasource.url=jdbc:mysql://45.79.125.85:3306/zynolo_nexus
spring.datasource.username=root
spring.datasource.password=@12Bdmin#!8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

############################
# JPA / HIBERNATE
############################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

############################
# ACTUATOR
############################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

############################
# LOGGING
############################
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

############################
# JACKSON
############################
spring.jackson.parser.allow-unquoted-field-names=true

############################
# DEFAULT COMPANY
############################
app.default.company-id=1

############################
# INTERNAL SERVICES
############################
auth.service.url=http://localhost:8091
internal.api.token=change-me-in-prod

############################
# MEETING BOOKING STATUS SYNC
############################
meeting.booking.status-sync-delay-ms=60000
meeting.booking.status-zone=Asia/Colombo
