spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

############################
# INTEGRATIONS
############################
auth.service.url=http://localhost:8091
setting.service.url=http://localhost:8092

############################
# JPA / HIBERNATE
############################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

############################
# MESSAGES
############################
spring.messages.basename=message/response
spring.messages.encoding=UTF-8

############################
# SPRING CLOUD
############################
spring.cloud.compatibility-verifier.enabled=false

############################
# ACTUATOR
############################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

############################
# LOGGING
############################
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

############################
# JACKSON
############################
spring.jackson.parser.allow-unquoted-field-names=true

############################
# INTERNAL
############################
internal.api.token=change-me-in-prod

############################
# DEFAULT COMPANY
############################
app.default.company-id=1

